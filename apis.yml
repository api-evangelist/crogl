name: Crogl
description: >-
  Crogl is an enterprise AI security operations platform that deploys autonomous
  AI agents to investigate security alerts and threat advisories entirely within
  a customer's own infrastructure. Using a neurosymbolic approach that combines
  knowledge graphs, large language models, and security best practices, Crogl
  gathers context, queries existing security tools, and cross-references data
  across SIEM, EDR, ticketing, and data-lake systems without exfiltrating data.
  It is tool-agnostic — integrating with Splunk, Microsoft Sentinel, CrowdStrike,
  ServiceNow, Jira, Databricks, Snowflake, Amazon S3, and Cribl — and every
  action is auditable so human analysts retain final decisions. Crogl is offered
  as a free single-user deployment and an enterprise plan with SSO, RBAC, and
  24/7 SLAs. It is a Menlo Ventures portfolio company. Crogl does not currently
  publish a public REST API, OpenAPI specification, or developer SDK; its API
  surface (connectors) is part of the on-premises product.
